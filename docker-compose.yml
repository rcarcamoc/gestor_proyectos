version: '3.8'

services:
  # --- INFRAESTRUCTURA COMPARTIDA ---
  redis:
    image: redis:alpine
    container_name: smarttrack_redis_prod
    restart: always
    networks:
      - portal_network

  # --- PORTAL DE ENTRADA (GATEWAY) ---
  home:
    image: nginx:alpine
    container_name: zen_portal
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./home/index.html:/usr/share/nginx/html/index.html
      - ./home/style.css:/usr/share/nginx/html/style.css
      - ./home/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - portal_network
    depends_on:
      - finanzas_app

  # --- GESTOR DE PROYECTOS (SMARTTRACK) ---
  gestor_backend:
    build: ./gestor/backend
    container_name: smarttrack_backend_prod
    restart: always
    env_file: ./gestor/.env
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    networks:
      - portal_network

  gestor_frontend:
    build:
      context: ./gestor/frontend
      dockerfile: Dockerfile.prod
    container_name: smarttrack_frontend_prod
    restart: always
    depends_on:
      - gestor_backend
    networks:
      - portal_network

  gestor_bot:
    build: ./gestor/telegram_bot
    container_name: smarttrack_telegram_bot_prod
    restart: always
    depends_on:
      - gestor_backend
      - redis
    env_file: ./gestor/.env
    networks:
      - portal_network

  finanzas_app:
    build: ./finanzas
    container_name: finanzas_app
    restart: always
    env_file: ./finanzas/.env
    environment:
      DATABASE_URL: mysql://hedkzmww_admin:sgsGRrR$$o2@server.001webhospedaje.com:3306/hedkzmww_finanzas
      NEXTAUTH_URL: http://129.151.113.195/finanzas
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      NEXTAUTH_SECRET: y0ur_v3ry_s3cr3t_n3xt_4uth_k3y
      AUTH_TRUST_HOST: "true"
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    networks:
      - portal_network

networks:
  portal_network:
    driver: bridge

